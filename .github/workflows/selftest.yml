# Live test of the Action on this repository's own pull requests (only files under examples/).
name: selftest
on:
  pull_request:
    paths: ["examples/**"]
permissions:
  contents: read
  pull-requests: write
jobs:
  behaviordiff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: ./
        with:
          api-key: ${{ secrets.NVIDIA_API_KEY }}
          provider: nvidia
          model: openai/gpt-oss-20b
