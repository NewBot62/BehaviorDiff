name: bench-models
# Manual run. Needs the repository secret LLM_API_KEY (an OpenRouter key).
# Benchmarks several cheap models on bench/cases and commits bench/results/.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated OpenRouter model ids. Empty = anchors + cheapest per vendor."
        default: ""
      max_models:
        description: "How many models when auto-picking"
        default: "8"
      runs:
        description: "Repeats per model (temperature 0, but providers vary)"
        default: "2"
      free_only:
        description: "true = only free (:free) models. Works without credit; rate-limited, so use few models and runs=1."
        default: "false"
      max_cost_per_model:
        description: "Hard spend cap per model in USD"
        default: "0.50"

permissions:
  contents: write

concurrency: bench-models

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      MODELS_INPUT: ${{ inputs.models }}
      MAX_MODELS: ${{ inputs.max_models }}
      RUNS: ${{ inputs.runs }}
      MAX_COST: ${{ inputs.max_cost_per_model }}
      FREE_ONLY: ${{ inputs.free_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Require API key
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "::error::Repository secret LLM_API_KEY is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - name: Check key and credit (one tiny call)
        run: |
          code=$(curl -s -o /tmp/auth.json -w '%{http_code}' -H "Authorization: Bearer $LLM_API_KEY" https://openrouter.ai/api/v1/auth/key)
          echo "OpenRouter key check: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::OpenRouter rejected the key (HTTP $code): $(head -c 300 /tmp/auth.json). Re-create the key and re-save the LLM_API_KEY secret with no spaces or line breaks."
            exit 1
          fi
          jq '{label: .data.label, limit: .data.limit, limit_remaining: .data.limit_remaining, usage: .data.usage, is_free_tier: .data.is_free_tier}' /tmp/auth.json
      - name: Refresh deterministic baseline
        run: node dist/bench/run.js
      - name: Choose models
        run: |
          if [ -n "$MODELS_INPUT" ]; then
            echo "$MODELS_INPUT" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' | jq -R . | jq -s . > models.json
          elif [ "$FREE_ONLY" = "true" ]; then
            node scripts/pick-models.mjs "$MAX_MODELS" --free > models.json
          else
            node scripts/pick-models.mjs "$MAX_MODELS" > models.json
          fi
          echo "Models:"; cat models.json
      - name: Run benchmark per model
        run: |
          mkdir -p bench/results
          {
            CONC=4; [ "$FREE_ONLY" = "true" ] && CONC=1
            echo "models: $(cat models.json)"
            for m in $(jq -r '.[]' models.json); do
              echo "=== $m"
              node dist/bench/llm.js --provider openrouter --model "$m" --runs "$RUNS" --max-cost "$MAX_COST" --concurrency "$CONC" || echo "FAILED: $m"
            done
          } 2>&1 | tee bench/results/last-run.log
      - name: Leaderboard
        run: |
          node dist/bench/leaderboard.js > /dev/null
          cat bench/results/LEADERBOARD.md >> "$GITHUB_STEP_SUMMARY"
          { echo; echo '### Run log'; echo '```'; tail -n 60 bench/results/last-run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/results
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "bench: model results $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
