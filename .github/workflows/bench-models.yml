name: bench-models
# Manual run. Needs the repository secret NVIDIA_API_KEY (provider nvidia) or OPENROUTER_API_KEY (provider openrouter).
# Benchmarks several cheap models on bench/cases and commits bench/results/.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Where the models run: openrouter (needs OPENROUTER_API_KEY secret) or nvidia (needs NVIDIA_API_KEY secret, build.nvidia.com)"
        type: choice
        options: [openrouter, nvidia]
        default: openrouter
      models:
        description: "Comma-separated model ids for the chosen provider. Empty = auto-pick."
        default: ""
      max_models:
        description: "How many models when auto-picking"
        default: "8"
      runs:
        description: "Repeats per model (temperature 0, but providers vary)"
        default: "2"
      suite:
        description: "Which case set: main, hard, real, or all"
        type: choice
        options: [all, both, main, hard, real]
        default: all
      free_only:
        description: "true = only free (:free) models. Works without credit; rate-limited, so use few models and runs=1."
        default: "false"
      max_cost_per_model:
        description: "Hard spend cap per model in USD"
        default: "0.50"

permissions:
  contents: write

concurrency: bench-models

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROVIDER: ${{ inputs.provider }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.LLM_API_KEY }}
      MODELS_INPUT: ${{ inputs.models }}
      MAX_MODELS: ${{ inputs.max_models }}
      RUNS: ${{ inputs.runs }}
      MAX_COST: ${{ inputs.max_cost_per_model }}
      FREE_ONLY: ${{ inputs.free_only }}
      SUITE: ${{ inputs.suite }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Require API key
        run: |
          if [ "$PROVIDER" = "nvidia" ]; then n=NVIDIA_API_KEY; else n=OPENROUTER_API_KEY; fi
          if [ -z "${!n}" ]; then
            echo "::error::Repository secret $n is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - name: Check key and account (one tiny call)
        run: |
          if [ "$PROVIDER" = "nvidia" ]; then
            code=$(curl -s -o /tmp/auth.json -w '%{http_code}' -H "Authorization: Bearer $NVIDIA_API_KEY" https://integrate.api.nvidia.com/v1/models)
            echo "NVIDIA key check: HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::NVIDIA rejected the key (HTTP $code): $(head -c 300 /tmp/auth.json). Create a key at build.nvidia.com (it starts with nvapi-) and re-save the NVIDIA_API_KEY secret with no spaces or line breaks."
              exit 1
            fi
            echo "models visible to this key: $(jq '.data | length' /tmp/auth.json)"
          else
            code=$(curl -s -o /tmp/auth.json -w '%{http_code}' -H "Authorization: Bearer $OPENROUTER_API_KEY" https://openrouter.ai/api/v1/auth/key)
            echo "OpenRouter key check: HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::OpenRouter rejected the key (HTTP $code): $(head -c 300 /tmp/auth.json). Re-create the key and re-save the OPENROUTER_API_KEY secret with no spaces or line breaks."
              exit 1
            fi
            jq '{label: .data.label, limit: .data.limit, limit_remaining: .data.limit_remaining, usage: .data.usage, is_free_tier: .data.is_free_tier}' /tmp/auth.json
          fi
      - name: Refresh deterministic baselines
        run: |
          node dist/bench/run.js
          node dist/bench/run.js --suite=hard
          node dist/bench/run.js --suite=real
      - name: Choose models
        run: |
          if [ -n "$MODELS_INPUT" ]; then
            echo "$MODELS_INPUT" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' | jq -R . | jq -s . > models.json
          elif [ "$PROVIDER" = "nvidia" ]; then
            node scripts/pick-models.mjs "$MAX_MODELS" --provider=nvidia > models.json
          elif [ "$FREE_ONLY" = "true" ]; then
            node scripts/pick-models.mjs "$MAX_MODELS" --free > models.json
          else
            node scripts/pick-models.mjs "$MAX_MODELS" > models.json
          fi
          echo "Models:"; cat models.json
      - name: Run benchmark per model
        run: |
          mkdir -p bench/results
          {
            CONC=4; { [ "$FREE_ONLY" = "true" ] || [ "$PROVIDER" = "nvidia" ]; } && CONC=1
            echo "models: $(cat models.json)"
            for m in $(jq -r '.[]' models.json); do
              echo "=== $m"
              for su in $(case "$SUITE" in all) echo "main hard real";; both) echo "main hard";; *) echo "$SUITE";; esac); do
                echo "--- suite: $su"
                node dist/bench/llm.js --provider "$PROVIDER" --model "$m" --suite "$su" --runs "$RUNS" --max-cost "$MAX_COST" --concurrency "$CONC" || echo "FAILED: $m ($su)"
              done
            done
          } 2>&1 | tee bench/results/last-run.log
      - name: Leaderboard
        run: |
          node dist/bench/leaderboard.js > /dev/null
          cat bench/results/LEADERBOARD.md >> "$GITHUB_STEP_SUMMARY"
          { echo; echo '### Run log'; echo '```'; tail -n 60 bench/results/last-run.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/results
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "bench: model results $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
